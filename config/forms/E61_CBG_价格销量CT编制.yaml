# CBG 价格&销量&加权CT 编制表 — E61 品类
# 结构: measure_blocks — (组织+渠道+品牌+产品+型号…) 组合键 × 4 个度量块 × N 期间
# 2026-11-23 live 复核（11月财总版）: header_row=56（期间）, 55（度量名）
#   度量块宽 7 列: 销售单价 AH-AN | 销量 AO-AU | 加权CT AV-BB | 销售收入 BC-BI
# 注意：块宽随版本期间窗口变化（11-11 录制时是 6 列，本次是 7 列）。
#   writer 会按第 55/56 行表头动态识别列；下面的 measures 只是识别失败时的兜底。
form_id: E61_CBG_价格销量CT编制
label: "价格&销量&加权CT"
workbook_pattern: "YCSRW026_价格*销量*加权CT编制表_CBG专用*"
sheet: "价格&销量&加权CT编制表_CBG专用"
layout: measure_blocks

header_row: 56
measure_name_row: 55           # 度量名所在行（动态识别列用）

mode_cell: null
mode_label_cell: null
# 页面顶部的「当前模式」显示：AL51=当前模式:，AM51=查询/编制。
# 查询态下销量/CT 输入区变蓝、写入不被 AO 识别，Plan_Save 会弹「没有要保存的数据」。
# writer 看到“查询 + 目标格有蓝色”会自动运行 Switch_mode 并轮询确认。
mode_display_cell: "AM51"
mode_switch:
  macro: "Switch_mode"
  force_set: false

version_cell: "F4"             # 预算版本显示文本
version_key_cell: "E4"         # 目标版本成员键（切版本写这里）
version_current_cell: "G4"     # SAP 当前变量值
version_match_cell: "H4"       # Y=目标与当前一致

# 行匹配 — 模板数据即 4 维：组织/渠道/品牌/产品。
# AD=产品成员（如 S11020101612），AF=客户型号（如 85K85H）；数据源「产品」列
# 两种写法都出现过，因此两个列组合都用于匹配已有行（主键 AD 优先）。
key_columns:
  - { column: AA, name: 组织 }
  - { column: AB, name: 渠道 }
  - { column: AC, name: 品牌 }
  - { column: AD, name: 产品 }
key_match_columns:
  - [AA, AB, AC, AD]
  - [AA, AB, AC, AF]
# 2026-11-24 16:00 实测（11月财总版）：AO 查询结果 57-123 共 67 行，124 行以后
# 是文本格式的模板残留行。在最后一条数据行下方补一条新组合（AA-AG 维度），
# 写入数值后 Plan_Save，关闭重开数据仍在（408 格全部读回成功）。
# 因此允许表尾追加；缺的维度（产品型号/客户型号/产品型号状态）从同产品的
# 既有行复制——数据源只有 组织/渠道/品牌/产品 四维，但这些也是保存所必需的。
allow_new_rows: true
append_rows: true              # 只在最后一条数据行下方追加，不占查询区中间空行
new_row_copy:                  # 追加行的补充维度：按产品从既有行复制
  match_column: AD             # 按产品成员匹配（同产品各渠道的属性一致）
  columns: [AE, AF, AG]        # 产品型号 / 客户型号 / 产品型号状态|时间
input_rows: [57, 256]          # 数据区默认 200 行；实际可写行以 AO 查询结果为准
skip_rows: []

# 度量块 — 每块 7 列，期间 2026.11, 2026.12, 2027.01..2027.05（仅作兜底）
measures:
  销售单价:
    "2026.11": AH
    "2026.12": AI
    "2027.01": AJ
    "2027.02": AK
    "2027.03": AL
    "2027.04": AM
    "2027.05": AN
  销量:
    "2026.11": AO
    "2026.12": AP
    "2027.01": AQ
    "2027.02": AR
    "2027.03": AS
    "2027.04": AT
    "2027.05": AU
  加权CT:
    "2026.11": AV
    "2026.12": AW
    "2027.01": AX
    "2027.02": AY
    "2027.03": AZ
    "2027.04": BA
    "2027.05": BB
  销售收入:
    "2026.11": BC
    "2026.12": BD
    "2027.01": BE
    "2027.02": BF
    "2027.03": BG
    "2027.04": BH
    "2027.05": BI

# 数据文件里的列名 → 度量名（源模板表头带后缀）
measure_aliases:
  销售单价: ["销售单价（含税）", "销售单价(含税)", "单价（含税）", "单价"]
  销量: ["销量(出货口径)", "销量（出货口径）", "销量(出货口径)（台）", "销量"]
  加权CT: ["加权CT", "加权CT价", "CT"]
  销售收入: ["销售收入", "收入"]

# 由 Excel 内 Execute_PS 运行包计算的度量，CSV 数据里本就没有（writer 缺列即跳过）；
# 离线校验据此不把 销售收入 当作 CSV 必填列
computed_measures:
  - 销售收入

macros:
  save: "Plan_Save"
  refresh: "Refresh_Sheet"
  switch_mode: "Switch_mode"

nav_cell: "AC55"               # CBG-智屏-价格&销量-乐华

item_aliases: {}
