# 费用及损益其他项编制查询表 — 非海外
# 结构: keyed — (组织+科目+产品+区域+渠道+品牌) 组合键 × 期间矩阵
# 2026-11-11 live 扫描确认: header_row=56, 期间 AG..AL
# 2026-11-25 用户确认: 数据区默认 200 行（57-256）
form_id: 费用及损益其他项编制_非海外
label: "变动费用（费用及损益其他项）"
workbook_pattern: "YC_费用及损益其他项编制查询表_非海外*"
sheet: "YC_费用及损益其他项编制查询表_非海外"
layout: keyed

header_row: 56

mode_cell: null
mode_label_cell: null
mode_switch:
  macro: "Switch_mode"
  force_set: false

version_cell: "F4"             # 预算版本显示文本
version_key_cell: "E4"         # 目标版本成员键（切版本写这里）
version_current_cell: "G4"     # SAP 当前变量值
version_match_cell: "H4"       # Y=目标与当前一致

# 行匹配 — 6 维组合键
key_columns:
  - { column: AA, name: 组织 }
  - { column: AB, name: 科目 }
  - { column: AC, name: 产品 }
  - { column: AD, name: 区域 }
  - { column: AE, name: 渠道 }
  - { column: AF, name: 品牌 }
input_rows: [57, 256]          # 数据区默认 200 行；实际以 key 匹配为准
skip_rows: []

# 期间列 — 2027.01 = AI（录制写入位）
month_columns:
  "2026.11": AG
  "2026.12": AH
  "2027.01": AI
  "2027.02": AJ
  "2027.03": AK
  "2027.04": AL

macros:
  save: "Plan_Save"
  refresh: "Refresh_Sheet"
  switch_mode: "Switch_mode"

nav_cell: "AC65"               # CBG-智屏-乐华品牌（编制毛利之下费用）

item_aliases: {}
