# CBG 客户费用编制表 — E61 品类
# 结构: keyed — (渠道 + 科目) 组合键 × 期间矩阵
# 2026-11-11 live 扫描确认: header_row=56, AA=渠道, AB=科目, 期间 AC..AR
# 2026-11-25 live 复核: 期间 AC..AS（2026.01-2027.05）, 数据行 57-256（默认 200 行）
form_id: E61_CBG_客户费用编制
label: "客户费用"
workbook_pattern: "YCSRW017_客户费用编制表_CBG专用*"
sheet: "客户费用编制表_CBG专用"
layout: keyed

header_row: 56

# 本表无 G51/G52 模式切换格（查询模式直出，AO 允许直接写入）
mode_cell: null
mode_label_cell: null
mode_switch:
  macro: "Switch_mode"
  force_set: false

version_cell: "F4"             # 预算版本显示文本
version_key_cell: "E4"         # 目标版本成员键（切版本写这里）
version_current_cell: "G4"     # SAP 当前变量值
version_match_cell: "H4"       # Y=目标与当前一致

# 行匹配 — 渠道 + 科目 联合定位
key_columns:
  - { column: AA, name: 渠道 }
  - { column: AB, name: 科目 }
# 数据区 57-256（默认 200 行）。A-I 列的宏参数块（66 行起）不在数据列上，
# 不影响 AA/AB 空白判断，不能当 skip_rows。
input_rows: [57, 256]
skip_rows: []
# 匹配不到的行（含整张表为空，如 TCL商用）在表尾新增：先写 AA 渠道 / AB 科目，
# 再写各期间金额。空白表从 57 行起追加。
allow_new_rows: true
append_rows: true

# 期间列 — 全期间 (2026.01 ~ 2027.04)，2027.01 = AO（录制写入位）
month_columns:
  "2026.01": AC
  "2026.02": AD
  "2026.03": AE
  "2026.04": AF
  "2026.05": AG
  "2026.06": AH
  "2026.07": AI
  "2026.08": AJ
  "2026.09": AK
  "2026.10": AL
  "2026.11": AM
  "2026.12": AN
  "2027.01": AO
  "2027.02": AP
  "2027.03": AQ
  "2027.04": AR
  "2027.05": AS

macros:
  save: "Plan_Save"
  refresh: "Refresh_Sheet"
  switch_mode: "Switch_mode"

nav_cell: "AC57"               # CBG-乐华客户费用-乐华

item_aliases: {}
